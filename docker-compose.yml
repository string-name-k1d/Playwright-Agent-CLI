
services:
  agent:
    container_name: playwright_cli
    build:
      context: ./agent
    env_file:
      .env
    environment:
      - DISPLAY=:99
      - NOVNC_PORT=6080
      - VNC_PORT=5900
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "6080:6080"   # noVNC web client
      - "5900:5900"   # VNC (optional, for native VNC clients)
    networks:
      - drupal_k8
      - default
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - .:/workspace
      - ./shared:/workspace/shared
      - ./.bash_aliases:/root/.bash_aliases
      # Mount host opencode config for API keys and settings
      - ${USERPROFILE:-~}/.config/opencode:/root/.config/opencode:ro
    working_dir: /workspace/agent
    command: /usr/local/bin/start-xvfb.sh

networks:
  drupal_k8:
    external: true
  default:
    driver: bridge
