
services:
  agent:
    container_name: playwright_cli
    build:
      context: ./agent
    env_file:
      .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - drupal_k8
      - default
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - .:/workspace
      - ./shared:/workspace/shared
      - ./.bash_aliases:/root/.bash_aliases
      # Mount host opencode config for API keys and settings
      - ${USERPROFILE:-~}/.config/opencode:/root/.config/opencode:ro
    working_dir: /workspace/agent
    command: tail -f /dev/null

networks:
  drupal_k8:
    external: true
  default:
    driver: bridge
